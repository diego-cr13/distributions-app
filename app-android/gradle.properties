# Gradle daemon memory (the Compose + KSP + Room toolchain is heavy on the JVM).
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX is required by Compose, Room and WorkManager.
android.useAndroidX=true
# Only the module's own resources are in its R class (faster builds).
android.nonTransitiveRClass=true

kotlin.code.style=official
